<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — Task Management</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Palet: Something Blue (#D8EBF9), Mother Earth (#513229), Lucky Dice (#F4F1E2), The Bay (#FCE6B7), Walking Vinnie (#D7D4B1) */
        body {
            background-color: #D8EBF9 !important;
            background-image: none !important;
            color: #3A231D !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: #FFFFFF !important;
            border: 1.5px solid #B5D2E8 !important;
            border-top: 5px solid #513229 !important;
            border-radius: 18px !important;
            box-shadow: 0 14px 32px rgba(58, 35, 29, 0.08) !important;
            padding: 32px 28px !important;
            max-width: 400px;
            width: 100%;
            margin: 0 !important;
        }

        .auth-container h2 {
            color: #513229 !important;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 18px;
        }

        .form-group label {
            color: #513229 !important;
            font-weight: 600;
        }

        .auth-container input {
            background: #F8FAFC !important;
            border: 1.5px solid #C2D9EB !important;
            color: #3A231D !important;
            border-radius: 10px !important;
        }

        .auth-container input::placeholder {
            color: #8A766E !important;
        }

        .auth-container input:focus {
            outline: none;
            background: #FFFFFF !important;
            border-color: #513229 !important;
            box-shadow: 0 0 0 3px rgba(81, 50, 41, 0.12) !important;
        }

        .auth-container button[type="submit"] {
            background: #513229 !important;
            color: #F4F1E2 !important;
            border: none !important;
            border-radius: 10px !important;
            font-weight: 600;
            transition: background 0.15s ease;
        }

        .auth-container button[type="submit"]:hover {
            background: #3A231D !important;
        }

        .toggle-link {
            color: #6E5349 !important;
        }

        .toggle-link:hover {
            color: #513229 !important;
            text-decoration: underline;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            width: 100% !important;
            padding-right: 42px !important;
            margin-bottom: 0 !important;
        }

        .password-wrapper .toggle-pw-btn {
            position: absolute !important;
            right: 10px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            width: auto !important;
            height: auto !important;
            padding: 4px !important;
            margin: 0 !important;
            background: transparent !important;
            border: none !important;
            color: #6E5349 !important;
            cursor: pointer;
            display: flex !important;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .password-wrapper .toggle-pw-btn:hover {
            color: #513229 !important;
            background: transparent !important;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <h2 id="form-title">Masuk ke Akun</h2>
        <div id="alert-box" class="alert"></div>

        <!-- Form Login -->
        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="nama@email.com" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="login-password" placeholder="Masukkan password" required>
                    <button type="button" class="toggle-pw-btn" onclick="togglePassword('login-password', this)"
                        title="Lihat Password" aria-label="Lihat Password">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit">Masuk</button>
            <p class="toggle-link" onclick="toggleMode('register')">Belum punya akun? Daftar sekarang</p>
        </form>

        <!-- Form Register -->
        <form id="register-form" style="display: none;">
            <div class="form-group">
                <label for="reg-name">Nama Lengkap</label>
                <input type="text" id="reg-name" placeholder="Nama lengkap" required>
            </div>
            <div class="form-group">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" placeholder="nama@email.com" required>
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="reg-password" placeholder="Minimal 6 karakter" minlength="6" required>
                    <button type="button" class="toggle-pw-btn" onclick="togglePassword('reg-password', this)"
                        title="Lihat Password" aria-label="Lihat Password">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit">Buat Akun</button>
            <p class="toggle-link" onclick="toggleMode('login')">Sudah punya akun? Masuk di sini</p>
        </form>
    </div>

    <script>
        const API_URL = "http://localhost:8080/api/v1";

        const eyeOpen = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        const eyeClosed = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const isHidden = input.type === "password";
            input.type = isHidden ? "text" : "password";
            btn.innerHTML = isHidden ? eyeClosed : eyeOpen;
            btn.title = isHidden ? "Sembunyikan Password" : "Lihat Password";
        }

        const existingToken = localStorage.getItem("token");
        const existingRole = localStorage.getItem("role");
        if (existingToken) {
            window.location.href = existingRole === "ADMIN" ? "admin.html" : "dashboard.html";
        }

        function toggleMode(mode) {
            document.getElementById("alert-box").className = "alert";
            const isRegister = mode === "register";
            document.getElementById("login-form").style.display = isRegister ? "none" : "block";
            document.getElementById("register-form").style.display = isRegister ? "block" : "none";
            document.getElementById("form-title").innerText = isRegister ? "Daftar Akun Baru" : "Masuk ke Akun";
        }

        function showAlert(msg, type) {
            const box = document.getElementById("alert-box");
            box.innerText = msg;
            box.className = "alert " + type;
        }

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) return showAlert(data.message || "Email atau password salah.", "error");

                localStorage.setItem("token", data.data.token);
                localStorage.setItem("role", data.data.user.role);
                localStorage.setItem("userName", data.data.user.name);

                window.location.href = data.data.user.role === "ADMIN" ? "admin.html" : "dashboard.html";
            } catch (err) {
                showAlert("Tidak dapat terhubung ke server backend.", "error");
            }
        });

        document.getElementById("register-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("reg-name").value.trim();
            const email = document.getElementById("reg-email").value.trim();
            const password = document.getElementById("reg-password").value;

            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();

                if (!res.ok) return showAlert(data.message || "Registrasi gagal.", "error");

                document.getElementById("register-form").reset();
                toggleMode("login");
                showAlert("Akun berhasil dibuat. Silakan masuk.", "success");
            } catch (err) {
                showAlert("Tidak dapat terhubung ke server backend.", "error");
            }
        });
    </script>
</body>

</html>
